[package]
name = "gluerift"
version = "0.3.1"
edition = "2024"
description = "Finite reference checker for the GlueRift Minimal Core"
license = "MIT OR Apache-2.0"

[lib]
name = "gluerift"
path = "src/lib.rs"

[[bin]]
name = "gluerift"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_jcs = "0.1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

