[package]
name = "gluerift-native"
version = "0.3.1"
edition = "2024"
publish = false
build = "build.rs"

[dependencies]
anyhow = "1.0.98"
hex = "0.4.3"
prost = "0.13.5"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"

[build-dependencies]
prost-build = "0.13.5"
protoc-bin-vendored = "3.2.0"

[dev-dependencies]
tempfile = "3.20.0"

[[bin]]
name = "gluerift-native-target"
path = "src/bin/target.rs"

[[bin]]
name = "gluerift-native-harness"
path = "src/bin/harness.rs"
